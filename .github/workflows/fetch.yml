name: Fetch Cineville programme

on:
  schedule:
    # Tuesdays 03:17 UTC = 05:17 Amsterdam in summer time, 04:17 in winter time
    - cron: "17 3 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch next 10 days
        run: python fetch.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Programme $(date -u +%F)"
          git push
